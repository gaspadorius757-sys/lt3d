services:
  - type: web
    name: lt3d
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - { key: NODE_VERSION, value: 22.13.0 }
      - { key: DB_PATH, value: /tmp/game.db }
      - { key: DATA_DIR, value: /tmp/data }
      - { key: DATA_TAG, value: v1 }
      - { key: DATA_URL, value: "https://github.com/gaspadorius757-sys/lt3d/releases/download/data-latest/lt3d-data.tar.gz" }
